[colors]
; Monochrome palette (matches the Ghostty rice)
background = #0D0D0D
background-alt = #0D0D0D
foreground = #F0F0F0
foreground-alt = #9A9A9A
primary = #4D4D4D
secondary = #B9B9B9
alert = #F0F0F0

[bar/example]
monitor = ${env:MONITOR:}
width = 100%
height = 22
radius = 0.0
fixed-center = true
top = yes
bottom = no
override-redirect = false

foreground = ${colors.foreground-alt}
background = ${colors.background-alt}

; Under-/overline pixel size and argb color
; Individual values can be defined using:
;   {overline,underline}-size
;   {overline,underline}-color
line-size = 1
line-color = #2A2A2A

border-top-size = 0
border-bottom-size = 0
border-left-size = 0
border-right-size = 0

padding-left = 0
padding-right = 0px

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:pixelsize=10;3"
font-1 = MesloLGS Nerd Font:pixelsize=9;3
font-2 = FontAwesome:pixelsize=9;3


modules-left = i3
modules-center = date
modules-right = network sp1 battery sp1 volume sp1 sleep-inhibit

wm-restack = i3

; bar click/scroll actions disabled
; scroll-up = #i3.next
; scroll-down = #i3.prev

cursor-click = default

[module/sp1]
type = custom/text
format = " | "
format-foreground = #2A2A2A
format-background = ${colors.background-alt}

[module/sp2]
type = custom/text
format = " |"
format-foreground = #2A2A2A
format-background = ${colors.background-alt}

; Fixed 5-slot workspace indicator. i3 destroys empty workspaces when you
; leave them, so internal/i3 can't keep slots 1-5 on screen. The script
; always renders all five and reads state over i3's IPC.
[module/i3]
type = custom/script
exec = ~/.config/polybar/scripts/i3-workspaces.sh
tail = true

[module/info-hackspeed]
type = custom/script
exec = ~/.config/polybar/scripts/info-hackspeed.sh
tail = true

[module/date]
type = internal/date
interval = 1

time = "%a %d %I:%M %P"

format-prefix = " "
format-prefix-foreground = ${colors.foreground-alt}
format-prefix-background = ${colors.background-alt}

label = %time%
label-foreground = ${colors.foreground-alt}
label-background = ${colors.background-alt}

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 1
; volume click/scroll actions disabled
; click-left = pamixer -t
; click-right = pavucontrol
; scroll-up = pamixer -i 5
; scroll-down = pamixer -d 5

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
; network click action disabled
; click-left = nmtui

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 10
; battery.sh appends the drain rate from scripts/battery_drain.sh right of
; the percentage: " 🔋 47%  ↓60.3%/h (42m)"
; battery click action disabled
; click-left = upower -i /org/freedesktop/UPower/devices/battery_BAT0

; Sleep-blocker chip (Mod+C): visible only while suspend is blocked.
[module/sleep-inhibit]
type = custom/script
exec = ~/.local/bin/sleep-toggle bar
interval = 1
format = <label>
format-foreground = ${colors.background-alt}
format-background = ${colors.foreground-alt}
format-padding = 1

[settings]
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-border = over

[global/wm]
margin-top = 5
margin-bottom = 5
