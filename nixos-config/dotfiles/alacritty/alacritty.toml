# ~/.config/alacritty/alacritty.toml
# Minimal monochrome Alacritty — neutral grayscale tuned to the
# i3 / Polybar / wallpaper palette (#0D0D0D → #F0F0F0).

[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 100, lines = 30 }
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 0.90
dynamic_title = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 12.0

[colors]
draw_bold_text_with_bright_colors = true

# ---- Base ----
[colors.primary]
background = "#0D0D0D"
foreground = "#E6E6E6"
dim_foreground = "#7A7A7A"
bright_foreground = "#FFFFFF"

[colors.cursor]
text = "#0D0D0D"
cursor = "#F0F0F0"

[colors.vi_mode_cursor]
text = "#0D0D0D"
cursor = "#B9B9B9"

# ---- UI accents (all grayscale) ----
[colors.selection]
text = "#F2F2F2"
background = "#3A3A3A"

[colors.search.matches]
foreground = "#0D0D0D"
background = "#8A8A8A"

[colors.search.focused_match]
foreground = "#0D0D0D"
background = "#E6E6E6"

[colors.footer_bar]
foreground = "#0D0D0D"
background = "#B9B9B9"

[colors.hints.start]
foreground = "#0D0D0D"
background = "#8A8A8A"

[colors.hints.end]
foreground = "#0D0D0D"
background = "#C8C8C8"

# ---- ANSI ramp ----
# Grayscale only, but ordered by the lightness of the color it replaces
# so normal CLI output (ls, git, etc.) keeps its visual hierarchy.
[colors.normal]
black = "#242424"
red = "#8A8A8A"
green = "#A6A6A6"
yellow = "#D6D6D6"
blue = "#6E6E6E"
magenta = "#9C9C9C"
cyan = "#C2C2C2"
white = "#E6E6E6"

[colors.bright]
black = "#4A4A4A"
red = "#B4B4B4"
green = "#C8C8C8"
yellow = "#F0F0F0"
blue = "#909090"
magenta = "#BEBEBE"
cyan = "#DEDEDE"
white = "#FFFFFF"

[cursor]
style = { shape = "Beam", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
