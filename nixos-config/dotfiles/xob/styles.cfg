# Minimal monochrome OSDs for volume + brightness.
# Same palette as the i3/polybar/Ghostty rice (#0D0D0D / #F0F0F0 / #2A2A2A).
#
# They are deliberately different shapes:
#   volume    -> slim solid bar, bottom centre
#   brightness -> slimmer vertical rail, right edge (TV-style)

volume = {
    x = { relative = 0.5; offset = 0; };
    y = { relative = 0.88; offset = 0; };

    length    = { relative = 0.16; offset = 0; };
    thickness = 6;
    outline   = 0;
    border    = 1;
    padding   = 2;

    orientation = "horizontal";
    overflow    = "hidden";

    color = {
        normal = {
            fg     = "#F0F0F0";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        # Muted state: same bar, dimmed.
        alt = {
            fg     = "#4D4D4D";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        overflow = {
            fg     = "#F0F0F0";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        altoverflow = {
            fg     = "#4D4D4D";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
    };
};

brightness = {
    x = { relative = 1.0; offset = -56; };
    y = { relative = 0.5; offset = 0; };

    length    = { relative = 0.24; offset = 0; };
    thickness = 6;
    outline   = 0;
    border    = 1;
    padding   = 3;

    orientation = "vertical";
    overflow    = "hidden";

    color = {
        normal = {
            fg     = "#B9B9B9";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        alt = {
            fg     = "#B9B9B9";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        overflow = {
            fg     = "#B9B9B9";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
        altoverflow = {
            fg     = "#B9B9B9";
            bg     = "#0D0D0Df2";
            border = "#2A2A2A";
        };
    };
};
